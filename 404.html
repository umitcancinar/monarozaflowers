<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — Mona Roza Flowers</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  body{overflow:visible;min-height:100svh;display:grid;place-items:center;text-align:center;padding:32px}
  .nf-wrap{display:grid;gap:18px;justify-items:center;max-width:440px}
  .nf-num{font-family:var(--font-display);font-size:clamp(4rem,14vw,7rem);font-weight:700;line-height:1;color:var(--accent)}
  .nf-wrap p{color:var(--text-2)}
  .nf-btn{display:inline-flex;align-items:center;gap:9px;padding:14px 28px;border-radius:99px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:.88rem;box-shadow:0 16px 34px -18px var(--accent)}
</style>
</head>
<body>
  <div class="nf-wrap">
    <span class="nf-num">404</span>
    <h1 style="font-family:var(--font-display);font-size:1.6rem;font-weight:600">Aradığınız sayfa bulunamadı</h1>
    <p>Bağlantı hatalı olabilir ya da bu sayfa kaldırılmış olabilir.</p>
    <a class="nf-btn" href="/">Anasayfaya Dön</a>
  </div>
</body>
</html>
